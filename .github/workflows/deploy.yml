name: Deploy

# Deploys the built site to Cloudflare with wrangler. Needs the repository
# secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and the variable
# VITE_API_BASE_URL pointing at the deployed Dogs API. Until the secret is
# set the job is skipped, so pushing to main is safe.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install @dogadopt/contracts over HTTPS
        # pnpm clones dog-adopt-spec over git and may pick an SSH URL, which
        # runners cannot use. Every GitHub URL form is rewritten to HTTPS with
        # a token. dog-adopt-spec is public, so GITHUB_TOKEN is enough; set the
        # CONTRACTS_READ_TOKEN secret (a PAT with Contents: read on the spec
        # repo) only if it is ever made private again.
        env:
          TOKEN: ${{ secrets.CONTRACTS_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          for from in "https://github.com/" "git@github.com:" "ssh://git@github.com/"; do
            git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "$from"
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
